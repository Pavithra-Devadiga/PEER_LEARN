<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeerLearn - Learn one skill, teach another</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="landing-body">
    <header class="landing-header">
        <div class="logo"><strong class="logo-text">PeerLearn</strong></div>
        <div class="top-actions" style="gap: 1rem;">
            <button class="mode-btn active" style="font-size: 1.1rem; padding: 0.8rem 2rem;">Sign In</button>
            <button class="mode-btn" style="background: var(--text-main); color: var(--panel-bg); font-size: 1.1rem; padding: 0.8rem 2rem;">Register</button>
        </div>
    </header>

    <main class="hero-section">
        <div style="background: var(--pastel-yellow); padding: 0.5rem 1.5rem; border: 2px solid var(--border-color); border-radius: 999px; font-weight: 700; margin-bottom: 2rem; box-shadow: 2px 2px 0px var(--border-color);">
            No admin approvals. Just community learning.
        </div>
        
        <h1 class="main-title" style="font-size: 6rem; line-height: 1.1; text-shadow: 4px 4px 0px var(--pastel-green);">
            Learn one skill,<br>teach another.
        </h1>
        
        <p style="font-size: 1.5rem; color: var(--text-muted); max-width: 650px; margin: 2.5rem 0 3.5rem 0; font-weight: 500; line-height: 1.4;">
            A transparent, data-driven peer-to-peer skill exchange platform for students. Search for tutors, book sessions, and share your knowledge.
        </p>
        
        <div style="display: flex; gap: 1.5rem;">
            <a href="index.html" class="hero-btn" style="background: var(--pastel-purple);">
                Enter Student Mode
            </a>
            <a href="tutor-home.html" class="hero-btn" style="background: var(--pastel-green);">
                Enter Tutor Mode
            </a>
        </div>
    </main>
</body>
</html>
